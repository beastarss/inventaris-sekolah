<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistem Inventaris Sekolah — Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f4f6f9;
      }
      .sidebar {
        min-height: 100vh;
        background: #343a40;
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        width: 230px;
        padding-top: 1rem;
        overflow-y: auto;
        z-index: 1030;
      }
      .sidebar a {
        color: #c2c7d0;
        text-decoration: none;
        display: block;
        padding: 0.6rem 1rem;
        border-radius: 0.25rem;
        margin: 0 0.5rem 0.15rem;
        cursor: pointer;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: #007bff;
        color: #fff;
      }
      .content {
        margin-left: 230px;
        padding: 1.5rem;
      }
      .brand {
        padding: 0 1rem 1rem;
        border-bottom: 1px solid #4b545c;
      }
      .badge-status {
        font-size: 0.75rem;
      }
      @media (max-width: 768px) {
        .sidebar {
          position: relative;
          width: 100%;
          min-height: auto;
        }
        .content {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar" id="sidebar">
      <div class="brand">
        <h5 class="mb-0"><i class="bi bi-box-seam"></i> Inventaris</h5>
        <small class="text-muted">Sistem Sekolah</small>
      </div>
      <nav class="mt-3" id="navMenu"></nav>
      <div class="px-3 mt-4 pb-3">
        <button class="btn btn-sm btn-outline-light w-100" id="btnLogout">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>

    <!-- ================= CONTENT ================= -->
    <div class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="pageTitle" class="mb-0">Dashboard</h4>
        <div>
          <span class="me-2"
            ><i class="bi bi-person-circle"></i>
            <span id="currentUser"></span>
          </span>
        </div>
      </div>
      <div id="pageContent"></div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal fade" id="appModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Form</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Batal
            </button>
            <button class="btn btn-primary" id="modalSave">Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      /* ============================================================
   LOCALSTORAGE DATABASE
   ============================================================ */
      const DB = {
        get(key) {
          return JSON.parse(localStorage.getItem("inv_" + key) || "[]");
        },
        set(key, val) {
          localStorage.setItem("inv_" + key, JSON.stringify(val));
        },
        nextId(key) {
          const arr = DB.get(key);
          return arr.length ? Math.max(...arr.map((x) => x.id)) + 1 : 1;
        },
      };

      /* ============================================================
   AUTH
   ============================================================ */
      let currentUser = JSON.parse(
        localStorage.getItem("inv_currentUser") || "null",
      );

      function login(email, password) {
        const u = DB.get("users").find(
          (x) => x.email === email && x.password === password,
        );
        if (!u) {
          alert("Email atau password salah!");
          return;
        }
        currentUser = u;
        localStorage.setItem("inv_currentUser", JSON.stringify(u));
        currentPage = "dashboard";
        logActivity("login", `${u.name} login ke sistem`);
        renderApp();
      }

      function logout() {
        localStorage.removeItem("inv_currentUser");
        currentUser = null;
        renderLogin();
      }

      /* ============================================================
   ACTIVITY LOG
   ============================================================ */
      function logActivity(action, description) {
        if (!currentUser) return;
        const logs = DB.get("activity_logs");
        logs.push({
          id: DB.nextId("activity_logs"),
          user_id: currentUser.id,
          action,
          description,
          created_at: formatDateTime(new Date()),
        });
        DB.set("activity_logs", logs);
      }

      /* ============================================================
   HELPERS
   ============================================================ */
      function formatDate(d) {
        if (!d) return "-";
        const bulan = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "Mei",
          "Jun",
          "Jul",
          "Agu",
          "Sep",
          "Okt",
          "Nov",
          "Des",
        ];
        const dt = d instanceof Date ? d : new Date(d);
        if (isNaN(dt)) return d;
        return (
          dt.getDate() + " " + bulan[dt.getMonth()] + " " + dt.getFullYear()
        );
      }
      function formatDateTime(d) {
        const dt = d instanceof Date ? d : new Date(d);
        const pad = (n) => String(n).padStart(2, "0");
        return (
          dt.getFullYear() +
          "-" +
          pad(dt.getMonth() + 1) +
          "-" +
          pad(dt.getDate()) +
          " " +
          pad(dt.getHours()) +
          ":" +
          pad(dt.getMinutes())
        );
      }
      function formatNumber(n) {
        return new Intl.NumberFormat("id-ID").format(n);
      }
      function getUser(id) {
        return DB.get("users").find((u) => u.id === id) || { name: "-" };
      }
      function getCategory(id) {
        return DB.get("categories").find((c) => c.id === id) || { name: "-" };
      }
      function getItem(id) {
        return DB.get("items").find((i) => i.id === id) || { name: "-" };
      }
      function statusBadge(s) {
        const map = {
          dipinjam: "warning",
          dikembalikan: "success",
          terlambat: "danger",
          baik: "success",
          "rusak ringan": "warning",
          "rusak berat": "danger",
        };
        return (
          '<span class="badge bg-' +
          (map[s] || "secondary") +
          ' badge-status">' +
          s +
          "</span>"
        );
      }
      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      /* ============================================================
   ROUTING
   ============================================================ */
      let currentPage = "dashboard";

      function navigate(page) {
        currentPage = page;
        renderMenu();
        renderPage();
      }

      /* ============================================================
   RENDER LOGIN
   ============================================================ */
      function renderLogin() {
        document.getElementById("sidebar").style.display = "none";
        document.querySelector(".content").style.marginLeft = "0";
        document.getElementById("pageTitle").innerText = "Login";
        document.getElementById("currentUser").innerText = "";
        document.getElementById("pageContent").innerHTML = `
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title text-center mb-3">
              <i class="bi bi-box-seam"></i> Inventaris Sekolah
            </h4>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input id="loginEmail" type="email" class="form-control"
                placeholder="email@sekolah.test" autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input id="loginPassword" type="password" class="form-control" placeholder="password">
            </div>
            <button class="btn btn-primary w-100" id="btnLogin">Login</button>
            <hr>
            <small class="text-muted d-block">
              <strong>Admin:</strong> admin@sekolah.test / password<br>
              <strong>User:</strong> maya@sekolah.test / password
            </small>
          </div>
        </div>
      </div>
    </div>`;

        document.getElementById("btnLogin").addEventListener("click", doLogin);
        document
          .getElementById("loginPassword")
          .addEventListener("keypress", (e) => {
            if (e.key === "Enter") doLogin();
          });
      }
      function doLogin() {
        login(
          document.getElementById("loginEmail").value.trim(),
          document.getElementById("loginPassword").value,
        );
      }

      /* ============================================================
   RENDER APP
   ============================================================ */
      function renderApp() {
        if (!currentUser) {
          renderLogin();
          return;
        }
        document.getElementById("sidebar").style.display = "block";
        document.querySelector(".content").style.marginLeft = "230px";
        document.getElementById("currentUser").innerText =
          currentUser.name + " (" + currentUser.role + ")";
        renderMenu();
        renderPage();
      }

      function renderMenu() {
        const menu = [
          {
            id: "dashboard",
            label: "Dashboard",
            icon: "speedometer2",
            roles: ["admin", "user"],
          },
          {
            id: "items",
            label: "Barang",
            icon: "box-seam",
            roles: ["admin", "user"],
          },
          {
            id: "categories",
            label: "Kategori",
            icon: "tags",
            roles: ["admin"],
          },
          {
            id: "loans",
            label: "Peminjaman",
            icon: "arrow-left-right",
            roles: ["admin", "user"],
          },
          {
            id: "returns",
            label: "Pengembalian",
            icon: "arrow-return-left",
            roles: ["admin"],
          },
          {
            id: "users",
            label: "Manajemen User",
            icon: "people",
            roles: ["admin"],
          },
          {
            id: "logs",
            label: "Activity Log",
            icon: "journal-text",
            roles: ["admin"],
          },
        ];

        const nav = document.getElementById("navMenu");
        nav.innerHTML = "";

        menu
          .filter((m) => m.roles.includes(currentUser.role))
          .forEach((m) => {
            const a = document.createElement("a");
            a.href = "#";
            a.dataset.page = m.id;
            if (currentPage === m.id) a.classList.add("active");
            a.innerHTML = '<i class="bi bi-' + m.icon + '"></i> ' + m.label;
            a.addEventListener("click", function (e) {
              e.preventDefault();
              navigate(m.id);
            });
            nav.appendChild(a);
          });
      }

      function renderPage() {
        const pages = {
          dashboard: renderDashboard,
          items: renderItems,
          categories: renderCategories,
          loans: renderLoans,
          returns: renderReturns,
          users: renderUsers,
          logs: renderLogs,
        };
        (pages[currentPage] || renderDashboard)();
      }

      /* ============================================================
   DASHBOARD
   ============================================================ */
      function renderDashboard() {
        document.getElementById("pageTitle").innerText = "Dashboard";
        const items = DB.get("items"),
          loans = DB.get("loans");
        const totalStock = items.reduce((s, i) => s + i.stock, 0);
        const dipinjam = loans.filter((l) => l.status === "dipinjam").length;
        const terlambat = loans.filter((l) => l.status === "terlambat").length;

        let html = `
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card border-start border-primary border-4">
        <div class="card-body">
          <div class="text-muted small">Total Barang</div>
          <h3>${formatNumber(items.length)}</h3>
        </div></div></div>
      <div class="col-md-3"><div class="card border-start border-success border-4">
        <div class="card-body">
          <div class="text-muted small">Total Stok</div>
          <h3>${formatNumber(totalStock)}</h3>
        </div></div></div>
      <div class="col-md-3"><div class="card border-start border-warning border-4">
        <div class="card-body">
          <div class="text-muted small">Sedang Dipinjam</div>
          <h3>${formatNumber(dipinjam)}</h3>
        </div></div></div>
      <div class="col-md-3"><div class="card border-start border-danger border-4">
        <div class="card-body">
          <div class="text-muted small">Terlambat</div>
          <h3>${formatNumber(terlambat)}</h3>
        </div></div></div>
    </div>`;

        if (currentUser.role === "admin") {
          html += `
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Barang Paling Sering Dipinjam</div>
            <ul class="list-group list-group-flush">
              ${
                topItems()
                  .map(
                    (x) =>
                      '<li class="list-group-item d-flex justify-content-between">' +
                      "<span>" +
                      escapeHtml(x.name) +
                      "</span><strong>" +
                      x.total +
                      "x</strong></li>",
                  )
                  .join("") || '<li class="list-group-item">Belum ada data</li>'
              }
            </ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">User Paling Aktif</div>
            <ul class="list-group list-group-flush">
              ${
                topUsers()
                  .map(
                    (x) =>
                      '<li class="list-group-item d-flex justify-content-between">' +
                      "<span>" +
                      escapeHtml(x.name) +
                      "</span><strong>" +
                      x.total +
                      "x</strong></li>",
                  )
                  .join("") || '<li class="list-group-item">Belum ada data</li>'
              }
            </ul>
          </div>
        </div>
      </div>`;
        } else {
          html += `
      <div class="card">
        <div class="card-header">Riwayat Peminjaman Saya (5 terakhir)</div>
        <ul class="list-group list-group-flush">
          ${
            DB.get("loans")
              .filter((l) => l.user_id === currentUser.id)
              .slice(-5)
              .reverse()
              .map(
                (l) =>
                  '<li class="list-group-item d-flex justify-content-between">' +
                  "<span>" +
                  escapeHtml(getItem(l.item_id).name) +
                  " (" +
                  l.quantity +
                  ")</span>" +
                  statusBadge(l.status) +
                  "</li>",
              )
              .join("") || '<li class="list-group-item">Belum ada</li>'
          }
        </ul>
      </div>`;
        }
        document.getElementById("pageContent").innerHTML = html;
      }

      function topItems() {
        const map = {};
        DB.get("loans").forEach((l) => {
          const n = getItem(l.item_id).name;
          map[n] = (map[n] || 0) + l.quantity;
        });
        return Object.entries(map)
          .map(([name, total]) => ({ name, total }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 5);
      }
      function topUsers() {
        const map = {};
        DB.get("loans").forEach((l) => {
          const n = getUser(l.user_id).name;
          map[n] = (map[n] || 0) + 1;
        });
        return Object.entries(map)
          .map(([name, total]) => ({ name, total }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 5);
      }

      /* ============================================================
   BARANG (ITEMS)
   ============================================================ */
      let itemSearch = "";
      function renderItems() {
        document.getElementById("pageTitle").innerText = "Data Barang";
        const isAdmin = currentUser.role === "admin";
        const items = DB.get("items").filter(
          (i) =>
            i.name.toLowerCase().includes(itemSearch.toLowerCase()) ||
            i.code.toLowerCase().includes(itemSearch.toLowerCase()),
        );
        const rows =
          items
            .map(
              (i) => `
    <tr>
      <td>${escapeHtml(i.code)}</td>
      <td>${escapeHtml(i.name)}</td>
      <td>${escapeHtml(getCategory(i.category_id).name)}</td>
      <td class="text-end">${formatNumber(i.stock)}</td>
      <td>${statusBadge(i.condition)}</td>
      <td>
        ${
          isAdmin
            ? '<button class="btn btn-sm btn-warning me-1" data-act="edit-item" data-id="' +
              i.id +
              '">' +
              '<i class="bi bi-pencil"></i></button>' +
              '<button class="btn btn-sm btn-danger" data-act="del-item" data-id="' +
              i.id +
              '">' +
              '<i class="bi bi-trash"></i></button>'
            : ""
        }
        ${
          currentUser.role === "user"
            ? '<button class="btn btn-sm btn-primary" data-act="pinjam" data-id="' +
              i.id +
              '">' +
              '<i class="bi bi-arrow-left-right"></i> Pinjam</button>'
            : ""
        }
      </td>
    </tr>`,
            )
            .join("") ||
          '<tr><td colspan="6" class="text-center">Tidak ada data</td></tr>';

        document.getElementById("pageContent").innerHTML = `
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Daftar Barang Inventaris</span>
        <div>
          <input id="searchItem" class="form-control form-control-sm d-inline-block w-auto me-2"
            placeholder="Cari..." value="${escapeHtml(itemSearch)}">
          ${

    </div>
    <div class="mb-3">
      <label class="form-label">Password ${u.id ? "" : '<span class="text-danger">*</span>'}</label>
      <input id="f_password" type="password" class="form-control"
        placeholder="${u.id ? "Biarkan kosong jika tidak diubah" : "Password"}">
    </div>
    <div class="mb-3">
      <label class="form-label">Role <span class="text-danger">*</span></label>
      <select id="f_role" class="form-select">
        <option value="user" ${u.role === "user" ? "selected" : ""}>User</option>
        <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
      </select>
    </div>`;
      }
      function addUser() {
        openModal("Tambah User", userForm());
        document.getElementById("modalSave").onclick = () => {
          const data = {
            name: document.getElementById("f_name").value.trim(),
            email: document.getElementById("f_email").value.trim(),
            password: document.getElementById("f_password").value,
            role: document.getElementById("f_role").value,
          };
          if (!data.name || !data.email || !data.password)
            return alert("Semua field wajib diisi");
          if (DB.get("users").some((u) => u.email === data.email))
            return alert("Email sudah terdaftar");
          const users = DB.get("users");
          data.id = DB.nextId("users");
          users.push(data);
          DB.set("users", users);
          logActivity("create_user", "Menambahkan user " + data.name);
          closeModal();
          renderUsers();
        };
      }
      function editUser(id) {
        const u = DB.get("users").find((x) => x.id === id);
        openModal("Edit User", userForm(u));
        document.getElementById("modalSave").onclick = () => {
          const users = DB.get("users");
          const target = users.find((x) => x.id === id);
          target.name = document.getElementById("f_name").value.trim();
          target.email = document.getElementById("f_email").value.trim();
          target.role = document.getElementById("f_role").value;
          const pwd = document.getElementById("f_password").value;
          if (pwd) target.password = pwd;
          DB.set("users", users);
          logActivity("update_user", "Mengubah user " + target.name);
          closeModal();
          renderUsers();
        };
      }
      function deleteUser(id) {
        if (!confirm("Yakin hapus user ini?")) return;
        DB.set(
          "users",
          DB.get("users").filter((u) => u.id !== id),
        );
        DB.set(
          "loans",
          DB.get("loans").filter((l) => l.user_id !== id),
        );
        logActivity("delete_user", "Menghapus user #" + id);
        renderUsers();
      }

      /* ============================================================
   ACTIVITY LOGS
   ============================================================ */
      function renderLogs() {
        document.getElementById("pageTitle").innerText = "Activity Log";
        const logs = DB.get("activity_logs").slice().reverse();
        const rows =
          logs
            .map(
              (l) => `
    <tr>
      <td>${l.id}</td>
      <td>${escapeHtml(getUser(l.user_id).name)}</td>
      <td><code>${escapeHtml(l.action)}</code></td>
      <td>${escapeHtml(l.description)}</td>
      <td>${escapeHtml(l.created_at)}</td>
    </tr>`,
            )
            .join("") ||
          '<tr><td colspan="5" class="text-center">Belum ada log</td></tr>';

        document.getElementById("pageContent").innerHTML = `
    <div class="card">
      <div class="card-header">Riwayat Aktivitas Sistem</div>
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead class="table-light">
            <tr><th>#</th><th>User</th><th>Aksi</th><th>Deskripsi</th><th>Waktu</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
      }

      /* ============================================================
   MODAL
   ============================================================ */
      let modalInstance = null;
      function openModal(title, bodyHtml) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;
        modalInstance = new bootstrap.Modal(
          document.getElementById("appModal"),
        );
        modalInstance.show();
        setTimeout(() => {
          const first = document.querySelector(
            "#modalBody input, #modalBody select, #modalBody textarea",
          );
          if (first) first.focus();
        }, 300);
      }
      function closeModal() {
        if (modalInstance) modalInstance.hide();
      }

      /* ============================================================
   INIT
   ============================================================ */
      document.getElementById("btnLogout").addEventListener("click", logout);

      seed();
      if (currentUser) renderApp();
      else renderLogin();
    </script>
  </body>
</html>
