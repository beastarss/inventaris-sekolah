      const Toast = Swal.mixin({
        toast: true,

        timer: 2500,
        timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener("mouseenter", Swal.stopTimer);
          toast.addEventListener("mouseleave", Swal.resumeTimer);
        },
      });

      function swalSuccess(msg) {
        Toast.fire({ icon: "success", title: msg });
      }
      function swalError(msg) {
        Toast.fire({ icon: "error", title: msg });
      }
      function swalInfo(msg) {
        Toast.fire({ icon: "info", title: msg });
      }
      function swalWarning(msg) {
        Toast.fire({ icon: "warning", title: msg });
      }
      function swalConfirm(title, text, confirmText) {
        return Swal.fire({
          title: title,
          text: text,
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#e74a3b",
          cancelButtonColor: "#858796",
          confirmButtonText: confirmText || "Ya, Hapus!",
          cancelButtonText: "Batal",

        },
        nextId(key) {
          const arr = DB.get(key);
          return arr.length ? Math.max(...arr.map((x) => x.id)) + 1 : 1;
        },
      };

            localStorage.removeItem("inv_currentUser");
            currentUser = null;
            renderLogin();

          id: DB.nextId("activity_logs"),
          user_id: currentUser.id,
          action,
          description,
          created_at: formatDateTime(new Date()),
        });
        DB.set("activity_logs", logs);
      }

      /* ============================================================
   HELPERS
   ============================================================ */
      function formatDate(d) {
        if (!d) return "-";
        const bulan = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "Mei",
          "Jun",
          "Jul",
          "Agu",
          "Sep",
          "Okt",
          "Nov",
          "Des",
        ];
        const dt = d instanceof Date ? d : new Date(d);
        if (isNaN(dt)) return d;
        return (
          dt.getDate() + " " + bulan[dt.getMonth()] + " " + dt.getFullYear()
        );
      }
      function formatDateTime(d) {
        const dt = d instanceof Date ? d : new Date(d);
        const pad = (n) => String(n).padStart(2, "0");
        return (
          dt.getFullYear() +
          "-" +
          pad(dt.getMonth() + 1) +
          "-" +
          pad(dt.getDate()) +
          " " +
          pad(dt.getHours()) +
          ":" +
          pad(dt.getMinutes())
        );
      }
      function formatNumber(n) {
        return new Intl.NumberFormat("id-ID").format(n);
      }

          "rusak ringan": "warning",
          "rusak berat": "danger",
        };
        return (
          '<span class="badge badge-' +
          (map[s] || "secondary") +
          ' badge-status">' +
          s +
          "</span>"
        );
      }
      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      let currentDataTable = null;
      function initDataTable(selector) {
        if (currentDataTable) {
          try {
            currentDataTable.destroy();
          } catch (e) {}
          currentDataTable = null;
        }
        currentDataTable = $(selector).DataTable({
          responsive: true,
          pageLength: 10,
          lengthMenu: [
            [5, 10, 25, 50, -1],
            [5, 10, 25, 50, "Semua"],
          ],
          language: {
            search: "Cari:",
            lengthMenu: "Tampilkan _MENU_ data",
            info: "Menampilkan _START_ - _END_ dari _TOTAL_ data",
            infoEmpty: "Tidak ada data",
            infoFiltered: "(difilter dari _MAX_ total data)",
            zeroRecords: "Data tidak ditemukan",
            emptyTable: "Tidak ada data",
            paginate: {
              first: "Awal",
              last: "Akhir",
              next: "Berikutnya",
              previous: "Sebelumnya",
            },
          },
          columnDefs: [{ targets: "no-sort", orderable: false }],
        });
        return currentDataTable;
      }

      function topItems() {
        const map = {};
        DB.get("loans").forEach((l) => {
          const n = getItem(l.item_id).name;
          map[n] = (map[n] || 0) + l.quantity;
        });
        return Object.entries(map)
          .map(([name, total]) => ({ name, total }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 5);
      }
      function topUsers() {
        const map = {};
        DB.get("loans").forEach((l) => {
          const n = getUser(l.user_id).name;
          map[n] = (map[n] || 0) + 1;
        });
        return Object.entries(map)
          .map(([name, total]) => ({ name, total }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 5);
      }

      /* ============================================================
   ACTION BINDER
   ============================================================ */
      function bindActions() {
        document.querySelectorAll("[data-act]").forEach((btn) => {
          btn.onclick = function () {
            const act = this.dataset.act;
            const id = this.dataset.id ? +this.dataset.id : null;
            if (act === "add-item") addItem();
            if (act === "edit-item") editItem(id);
            if (act === "del-item") deleteItem(id);
            if (act === "pinjam") ajukanPinjam(id);
            if (act === "add-cat") addCategory();
            if (act === "edit-cat") editCategory(id);
            if (act === "del-cat") deleteCategory(id);
            if (act === "filter") {
              loanFilter = this.dataset.status;
              renderLoans();
            }
            if (act === "add-loan") addLoan();
            if (act === "return") openReturn(id);
            if (act === "del-loan") deleteLoan(id);
            if (act === "add-user") addUser();
            if (act === "edit-user") editUser(id);
            if (act === "del-user") deleteUser(id);
          };
        });
      }

      /* ============================================================
   ITEM CRUD
   ============================================================ */
      function addItem() {
        openModal("Tambah Barang", itemForm());
        document.getElementById("modalSave").onclick = () => saveItem();
      }
      function editItem(id) {
        const i = DB.get("items").find((x) => x.id === id);
        openModal("Edit Barang", itemForm(i));
        document.getElementById("modalSave").onclick = () => saveItem(id);
      }
      function itemForm(i) {
        i = i || {};
        const cats = DB.get("categories");
        return `
    <div class="form-group">
      <label>Kategori <span class="text-danger">*</span></label>
      <select id="f_category" class="form-control">
        ${cats.map((c) => '<option value="' + c.id + '" ' + (i.category_id === c.id ? "selected" : "") + ">" + escapeHtml(c.name) + "</option>").join("")}
      </select>
    </div>
    <div class="form-group">
      <label>Nama Barang <span class="text-danger">*</span></label>
      <input id="f_name" class="form-control" placeholder="cth: Mikroskop" value="${escapeHtml(i.name || "")}">
    </div>
    <div class="form-group">
      <label>Kode/SKU <span class="text-danger">*</span></label>
      <input id="f_code" class="form-control" placeholder="cth: LAB-001" value="${escapeHtml(i.code || "")}">
    </div>
    <div class="form-group">
      <label>Stok <span class="text-danger">*</span></label>
      <input id="f_stock" type="number" class="form-control" placeholder="0" value="${i.stock || 0}">
    </div>
    <div class="form-group">
      <label>Kondisi <span class="text-danger">*</span></label>
      <select id="f_condition" class="form-control">
        ${["baik", "rusak ringan", "rusak berat"].map((c) => "<option " + (i.condition === c ? "selected" : "") + ">" + c + "</option>").join("")}
      </select>
    </div>`;
      }
      function saveItem(id) {
        const data = {
          category_id: +document.getElementById("f_category").value,
          name: document.getElementById("f_name").value.trim(),
          code: document.getElementById("f_code").value.trim(),
          stock: +document.getElementById("f_stock").value,
          condition: document.getElementById("f_condition").value,
        };
        if (!data.name || !data.code)
          return swalError("Nama dan Kode wajib diisi");
        const items = DB.get("items");
        if (id) {
          const idx = items.findIndex((x) => x.id === id);
          items[idx] = Object.assign({}, items[idx], data);
          logActivity("update_item", "Mengubah barang " + data.name);
          swalSuccess("Barang berhasil diubah!");
        } else {
          data.id = DB.nextId("items");
          items.push(data);
          logActivity("create_item", "Menambahkan barang " + data.name);
          swalSuccess("Barang berhasil ditambahkan!");
        }
        DB.set("items", items);
        closeModal();
        renderItems();
      }
      function deleteItem(id) {
        const item = DB.get("items").find((x) => x.id === id);
        swalConfirm(
          "Hapus Barang?",
          'Barang "' + item.name + '" akan dihapus permanen.',
          "Ya, Hapus!",
        ).then((result) => {
          if (result.isConfirmed) {
            DB.set(
              "items",
              DB.get("items").filter((x) => x.id !== id),
            );
            logActivity("delete_item", "Menghapus barang " + item.name);
            swalSuccess("Barang berhasil dihapus!");
            renderItems();
          }
        });
      }

      <input id="f_cat" class="form-control" value="${escapeHtml(c.name)}">
    </div>`,
        );
        document.getElementById("modalSave").onclick = () => {
          const name = document.getElementById("f_cat").value.trim();
          if (!name) return swalError("Nama wajib diisi");
          const cats = DB.get("categories");
          cats.find((x) => x.id === id).name = name;
          DB.set("categories", cats);
          logActivity("update_category", "Mengubah kategori " + name);
          swalSuccess("Kategori berhasil diubah!");
          closeModal();
          renderCategories();
        };
      }
      function deleteCategory(id) {
        if (DB.get("items").some((i) => i.category_id === id))
          return swalError(
            "Tidak bisa dihapus, masih ada barang di kategori ini",
          );
        const cat = DB.get("categories").find((x) => x.id === id);
        swalConfirm(
          "Hapus Kategori?",
          'Kategori "' + cat.name + '" akan dihapus.',
          "Ya, Hapus!",
        ).then((result) => {
          if (result.isConfirmed) {
            DB.set(
              "categories",
              DB.get("categories").filter((x) => x.id !== id),
            );
            logActivity("delete_category", "Menghapus kategori " + cat.name);
            swalSuccess("Kategori berhasil dihapus!");
            renderCategories();
          }
        });
      }

      /* ============================================================
   LOAN ACTIONS
   ============================================================ */
      function ajukanPinjam(itemId) {
        const item = getItem(itemId);
        if (item.stock <= 0) return swalError("Stok habis");
        openModal(
          "Ajukan Peminjaman",
          `
    <div class="form-group">
      <label>Barang</label>
      <input class="form-control" value="${escapeHtml(item.name)}" disabled>
    </div>
    <div class="form-group">
      <label>Jumlah <span class="text-danger">*</span></label>
      <input id="f_qty" type="number" min="1" max="${item.stock}" value="1" class="form-control">
    </div>
    <div class="form-group">
      <label>Tanggal Pinjam <span class="text-danger">*</span></label>
      <input id="f_loan_date" type="date" class="form-control" value="${new Date().toISOString().slice(0, 10)}">
    </div>
    <div class="form-group">
      <label>Jatuh Tempo <span class="text-danger">*</span></label>
      <input id="f_due_date" type="date" class="form-control">
    </div>`,
        );
        document.getElementById("modalSave").onclick = () => {
          const qty = +document.getElementById("f_qty").value;
          const loan_date = document.getElementById("f_loan_date").value;
          const due_date = document.getElementById("f_due_date").value;
          if (!qty || !loan_date || !due_date)
            return swalError("Semua field wajib diisi");
          if (qty > item.stock) return swalError("Jumlah melebihi stok");

          const loans = DB.get("loans");
          loans.push({
            id: DB.nextId("loans"),
            user_id: currentUser.id,
            item_id: itemId,
            quantity: qty,
            loan_date,
            due_date,
            status: "dipinjam",
          });
          DB.set("loans", loans);

          const items = DB.get("items");
          items.find((i) => i.id === itemId).stock -= qty;
          DB.set("items", items);

          logActivity(
            "create_loan",
            "Mengajukan peminjaman " + item.name + " (" + qty + ")",
          );
          swalSuccess("Peminjaman berhasil diajukan!");
          closeModal();
          renderLoans();
        };
      }

      function addLoan() {
        const users = DB.get("users").filter((u) => u.role === "user");
        const items = DB.get("items").filter((i) => i.stock > 0);
        if (!items.length)
          return swalError("Tidak ada barang dengan stok tersedia");
        openModal(
          "Tambah Peminjaman (Admin)",
          `
    <div class="form-group">
      <label>Peminjam <span class="text-danger">*</span></label>
      <select id="f_user" class="form-control">
        ${users.map((u) => '<option value="' + u.id + '">' + escapeHtml(u.name) + "</option>").join("")}
      </select>
    </div>
    <div class="form-group">
      <label>Barang <span class="text-danger">*</span></label>
      <select id="f_item" class="form-control">
        ${items.map((i) => '<option value="' + i.id + '">' + escapeHtml(i.name) + " (stok: " + i.stock + ")</option>").join("")}
      </select>
    </div>
    <div class="form-group">
      <label>Jumlah <span class="text-danger">*</span></label>
      <input id="f_qty" type="number" min="1" value="1" class="form-control">
    </div>
    <div class="form-group">
      <label>Tanggal Pinjam <span class="text-danger">*</span></label>
      <input id="f_loan_date" type="date" class="form-control" value="${new Date().toISOString().slice(0, 10)}">
    </div>
    <div class="form-group">
      <label>Jatuh Tempo <span class="text-danger">*</span></label>
      <input id="f_due_date" type="date" class="form-control">
    </div>`,
        );
        document.getElementById("modalSave").onclick = () => {
          const user_id = +document.getElementById("f_user").value;
          const item_id = +document.getElementById("f_item").value;
          const qty = +document.getElementById("f_qty").value;
          const loan_date = document.getElementById("f_loan_date").value;
          const due_date = document.getElementById("f_due_date").value;
          if (!qty || !loan_date || !due_date)
            return swalError("Semua field wajib diisi");
          const item = getItem(item_id);
          if (qty > item.stock) return swalError("Jumlah melebihi stok");

          const loans = DB.get("loans");
          loans.push({
            id: DB.nextId("loans"),
            user_id,
            item_id,
            quantity: qty,
            loan_date,
            due_date,
            status: "dipinjam",
          });
          DB.set("loans", loans);

          const items = DB.get("items");
          items.find((i) => i.id === item_id).stock -= qty;
          DB.set("items", items);

          logActivity(
            "create_loan",
            "Menambahkan peminjaman " +
              item.name +
              " untuk " +
              getUser(user_id).name,
          );
          swalSuccess("Peminjaman berhasil ditambahkan!");
          closeModal();
          renderLoans();
        };
      }

      function deleteLoan(id) {
        const loan = DB.get("loans").find((l) => l.id === id);
        swalConfirm(
          "Hapus Peminjaman?",
          "Peminjaman #" + id + " akan dihapus.",
          "Ya, Hapus!",
        ).then((result) => {
          if (result.isConfirmed) {
            if (loan.status !== "dikembalikan") {
              const items = DB.get("items");
              items.find((i) => i.id === loan.item_id).stock += loan.quantity;
              DB.set("items", items);
            }
            DB.set(
              "loans",
              DB.get("loans").filter((l) => l.id !== id),
            );
            DB.set(
              "return_logs",
              DB.get("return_logs").filter((r) => r.loan_id !== id),
            );
            logActivity("delete_loan", "Menghapus peminjaman #" + id);
            swalSuccess("Peminjaman berhasil dihapus!");
            renderLoans();
          }
        });
      }

      function openReturn(loanId) {
        const loan = DB.get("loans").find((l) => l.id === loanId);
        const item = getItem(loan.item_id);
        openModal(
          "Pengembalian Barang",
          `
    <div class="form-group">
      <label>Peminjam</label>
      <input class="form-control" value="${escapeHtml(getUser(loan.user_id).name)}" disabled>
    </div>
    <div class="form-group">
      <label>Barang</label>
      <input class="form-control" value="${escapeHtml(item.name)} (${loan.quantity})" disabled>
    </div>
    <div class="form-group">
      <label>Tanggal Kembali <span class="text-danger">*</span></label>
      <input id="f_returned" type="date" class="form-control" value="${new Date().toISOString().slice(0, 10)}">
    </div>
    <div class="form-group">
      <label>Kondisi Saat Kembali <span class="text-danger">*</span></label>
      <select id="f_cond" class="form-control">
        ${["baik", "rusak ringan", "rusak berat"].map((c) => "<option>" + c + "</option>").join("")}
      </select>
    </div>
    <div class="form-group">
      <label>Catatan</label>
      <textarea id="f_notes" class="form-control" placeholder="Opsional"></textarea>
    </div>`,
        );
        document.getElementById("modalSave").onclick = () => {
          const returned_at = document.getElementById("f_returned").value;
          const condition_on_return = document.getElementById("f_cond").value;
          const notes = document.getElementById("f_notes").value.trim();
          if (!returned_at) return swalError("Tanggal wajib diisi");

          const logs = DB.get("return_logs");
          logs.push({
            id: DB.nextId("return_logs"),
            loan_id: loanId,
            returned_at,
            condition_on_return,
            notes,
          });
          DB.set("return_logs", logs);

          const loans = DB.get("loans");
          loans.find((l) => l.id === loanId).status = "dikembalikan";
          DB.set("loans", loans);

          const items = DB.get("items");
          items.find((i) => i.id === loan.item_id).stock += loan.quantity;
          DB.set("items", items);

          logActivity("return_item", "Mengembalikan " + item.name);
          swalSuccess("Barang berhasil dikembalikan!");
          closeModal();
          renderLoans();
        };
      }

      /* ============================================================
   USER CRUD
   ============================================================ */
      function userForm(u) {
        u = u || {};
        return `
    <div class="form-group">
      <label>Nama <span class="text-danger">*</span></label>
      <input id="f_name" class="form-control" value="${escapeHtml(u.name || "")}" placeholder="Nama lengkap">
    </div>
    <div class="form-group">
      <label>Email <span class="text-danger">*</span></label>
      <input id="f_email" type="email" class="form-control" value="${escapeHtml(u.email || "")}" placeholder="email@sekolah.test">
    </div>
    <div class="form-group">
      <label>Password ${u.id ? "" : '<span class="text-danger">*</span>'}</label>
      <input id="f_password" type="password" class="form-control" placeholder="${u.id ? "Biarkan kosong jika tidak diubah" : "Password"}">
    </div>
    <div class="form-group">
      <label>Role <span class="text-danger">*</span></label>
      <select id="f_role" class="form-control">
        <option value="user" ${u.role === "user" ? "selected" : ""}>User</option>
        <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
      </select>
    </div>`;
      }
      function addUser() {
        openModal("Tambah User", userForm());
        document.getElementById("modalSave").onclick = () => {
          const data = {
            name: document.getElementById("f_name").value.trim(),
            email: document.getElementById("f_email").value.trim(),
            password: document.getElementById("f_password").value,
            role: document.getElementById("f_role").value,
          };
          if (!data.name || !data.email || !data.password)
            return swalError("Semua field wajib diisi");
          if (DB.get("users").some((u) => u.email === data.email))
            return swalError("Email sudah terdaftar");
          const users = DB.get("users");
          data.id = DB.nextId("users");
          users.push(data);
          DB.set("users", users);
          logActivity("create_user", "Menambahkan user " + data.name);
          swalSuccess("User berhasil ditambahkan!");
          closeModal();
          renderUsers();
        };
      }
      function editUser(id) {
        const u = DB.get("users").find((x) => x.id === id);
        openModal("Edit User", userForm(u));
        document.getElementById("modalSave").onclick = () => {
          const users = DB.get("users");
          const target = users.find((x) => x.id === id);
          target.name = document.getElementById("f_name").value.trim();
          target.email = document.getElementById("f_email").value.trim();
          target.role = document.getElementById("f_role").value;
          const pwd = document.getElementById("f_password").value;
          if (pwd) target.password = pwd;
          DB.set("users", users);
          logActivity("update_user", "Mengubah user " + target.name);
          swalSuccess("User berhasil diubah!");
          closeModal();
          renderUsers();
        };
      }
      function deleteUser(id) {
        const user = DB.get("users").find((u) => u.id === id);
        swalConfirm(
          "Hapus User?",
          'User "' + user.name + '" akan dihapus beserta data peminjamannya.',
          "Ya, Hapus!",
        ).then((result) => {
          if (result.isConfirmed) {
            DB.set(
              "users",
              DB.get("users").filter((u) => u.id !== id),
            );
            DB.set(
              "loans",
              DB.get("loans").filter((l) => l.user_id !== id),
            );
            logActivity("delete_user", "Menghapus user " + user.name);
            swalSuccess("User berhasil dihapus!");
            renderUsers();
          }
        });
      }

      /* ============================================================
   MODAL
   ============================================================ */
      function openModal(title, bodyHtml) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;
        $("#appModal").modal("show");
        setTimeout(() => {
          const first = document.querySelector(
            "#modalBody input, #modalBody select, #modalBody textarea",
          );
          if (first) first.focus();
        }, 300);
      }
      function closeModal() {
        $("#appModal").modal("hide");
      }

      /* ============================================================
   INIT
   ============================================================ */
      document.addEventListener("DOMContentLoaded", function () {
        // Event login
        document
          .getElementById("btnLogin")
          .addEventListener("click", doLoginAction);
        document
          .getElementById("loginPassword")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") doLoginAction();
          });
        document
          .getElementById("loginEmail")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") doLoginAction();
          });

        // Event logout
        document
          .getElementById("btnLogout")
          .addEventListener("click", function (e) {
            e.preventDefault();
            logout();
          });

        // Sidebar toggle
        $("#sidebarToggle, #sidebarToggleTop").on("click", function (e) {
          e.preventDefault();
          $("body").toggleClass("sidebar-toggled");
          $(".sidebar").toggleClass("toggled");
        });

        // Init
        seed();
        if (currentUser) {
          renderApp();
        } else {
          renderLogin();
        }
      });
    </script>
  </body>
</html>
